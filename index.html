<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>City Drive</title><style>*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none}html,body{width:100%;height:100%;overflow:hidden;background:#0f172a;font-family:-apple-system,sans-serif;color:#fff}canvas{display:block;width:100%;height:100%;touch-action:none}#ui{position:fixed;top:0;left:0;right:0;padding:16px;display:flex;justify-content:space-between;font-weight:800;font-size:18px;pointer-events:none;z-index:5}.badge{background:rgba(15,23,42,.8);border:1px solid rgba(255,255,255,.2);padding:8px 14px;border-radius:99px}#menu{position:fixed;inset:0;background:rgba(15,23,42,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;z-index:10}h1{font-size:32px;color:#38bdf8;margin-bottom:6px}.sub{color:#94a3b8;font-size:14px;margin-bottom:16px}.cars{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:340px;margin-bottom:20px}.card{background:#1e293b;border:2px solid #334155;border-radius:14px;padding:12px}.card.active{border-color:#38bdf8;background:#0f172a}.btn{background:#0284c7;color:#fff;border:none;border-radius:14px;padding:16px;font-size:18px;font-weight:800;width:100%;max-width:340px}</style></head><body><canvas id="c"></canvas><div id="ui"><div class="badge">&#9733; <span id="sHud">0</span></div><div class="badge">Счёт: <span id="pHud">0</span></div></div><div id="menu"><h1>CITY DRIVE</h1><p class="sub">Обгоняй машины, собирай звёзды и открывай авто</p><div class="badge" style="margin-bottom:14px">Твои звёзды: &#9733; <span id="sMenu">0</span></div><div class="cars" id="list"></div><button class="btn" id="go" onclick="startGame()">ПОЕХАЛИ</button><p class="sub" style="margin-top:12px">Жми слева или справа для перестроения</p></div><script>const c=document.getElementById('c'),x=c.getContext('2d
