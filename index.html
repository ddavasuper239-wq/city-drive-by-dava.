<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>City Drive by Dava</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #111827; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #fff; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #ui { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 16px; }
    .hud-top { display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-size: 18px; text-shadow: 0 2px 6px rgba(0,0,0,0.7); }
    .badge { background: rgba(17,24,39,0.75); border: 1px solid rgba(255,255,255,0.15); padding: 8px 14px; border-radius: 999px; }
    #menu { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.92); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; z-index: 10; }
    h1 { font-size: 32px; letter-spacing: 1px; margin-bottom: 6px; color: #38bdf8; }
    p.sub { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
    .cars { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 100%; max-width: 360px; margin-bottom: 22px; }
    .car-card { background: #1e293b; border: 2px solid #334155; border-radius: 14px; padding: 12px; cursor: pointer; transition: 0.15s; }
    .car-card.active { border-color: #38bdf8; background: #0f172a; }
    .car-card.locked { opacity: 0.7; }
    .car-name { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
    .car-info { font-size: 12px; color: #cbd5e1; }
    .btn { background: linear-gradient(135deg, #0ea5e9, #2563eb); color: #fff; border: none; border-radius: 14px; padding: 15px 36px; font-size: 18px; font-weight: 800; cursor: pointer; width: 100%; max-width: 360px; box-shadow: 0 8px 20px rgba(37,99,235,0.4); }
    .btn:active { transform: scale(0.98); }
    .controls-hint { margin-top: 14px; font-size: 12px; color: #94a3b8; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui">
    <div class="hud-top">
      <div class="badge">⭐ <span id="starsHud">0</span></div>
      <div class="badge">🏁 <span id="scoreHud">0</span></div>
    </div>
  </div>

  <div id="menu">
    <h1>CITY DRIVE</h1>
    <p class="sub">Обгоняй машины, собирай ⭐ и открывай новые авто</p>
    <div class="badge" style="margin-bottom:16px;">Твои звёзды: ⭐ <span id="starsMenu">0</span></div>
    <div class="cars" id="carList"></div>
    <button class="btn" id="startBtn">ПОЕХАЛИ</button>
    <div class="controls-hint">Нажимай на левую или правую часть экрана для перестроения</div>
  </div>
